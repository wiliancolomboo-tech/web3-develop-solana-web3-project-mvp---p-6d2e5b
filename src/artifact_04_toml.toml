[package]
name = "eduvibe-protocol"
version = "0.1.0"
description = "KNEU EduVibe: Academic Grant & Milestone Escrow Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "eduvibe_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }